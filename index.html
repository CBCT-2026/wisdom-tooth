<link rel="stylesheet" href="style.css">
<style>
  h1 span { display: block; font-size: 1.1rem; margin-top: 4px; }
  .lead { font-size: 18px; font-weight: 600; margin: 8px 0 0; }
  .choice { margin-top: 28px; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
  .choice h2 { margin: 0 0 14px; text-align: center; font-size: 22px; line-height: 1.35; }
  .choice h2 span { display: block; font-size: 18px; font-weight: 600; }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .top { display: flex; justify-content: flex-end; padding-top: 10px; }
  .pick a, .pick .pick-off { display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 16px 8px; border-radius: 14px;
    background: var(--ar); color: var(--ar-text); text-decoration: none; font-weight: 600; font-size: 18px; }
  .pick .pick-off { background: var(--card); color: var(--muted); border: 1px dashed var(--line); }
  .pick a small, .pick .pick-off small { display: block; font-size: 14px; font-weight: 400; }
  .qr { margin: 28px 0 32px; text-align: center; }
  .qr button { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: var(--text); }
  .qr img { display: block; width: 160px; height: 160px; margin: 0 auto 8px; padding: 8px; background: #fff; border-radius: 8px; }
  .qr span { text-decoration: underline; }
  #qr-big { width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #fff; color: #000; }
  #qr-big[open] { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  #qr-big img { width: min(88vw, 70vh); height: min(88vw, 70vh); }
  #qr-big p { margin: 0; font-size: min(18px, 4.2vw); white-space: nowrap; text-align: center; padding: 0 16px; }
  #qr-big button { font: inherit; font-size: 18px; padding: 10px 22px; border-radius: 12px; border: 1px solid #231f20; background: #fff; color: #231f20; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="top"><button class="theme" id="theme" type="button" data-dark="Dark mode" data-dark-ja="ダークモード" data-light="Light mode" data-light-ja="ライトモード">Dark mode</button></div>
  <h1>Wisdom tooth removal: the risk to your nerve<span lang="ja">親知らずを<ruby>抜<rt>ぬ</rt></ruby>くときの、神経が傷つくリスク</span></h1>

    </div>
  </section>

    <h2 id="video">Narrated video<span lang="ja">ナレーション動画</span></h2>
    <div class="pick">
      <a href="video/en/" aria-label="Narrated video, English">English</a>
      <a href="video/ja/" lang="ja" aria-label="ナレーション動画、日本語">日本語</a>
    </div>
  </section>
  <section class="choice" aria-labelledby="form">
    <h2 id="form">Study form<span lang="ja">研究フォーム</span></h2>
    <p class="lead" style="text-align:center;margin:0 0 14px">Information sheet and survey<br><span lang="ja">説明書とアンケート</span></p>
    <div class="pick">
      <a href="https://forms.cloud.microsoft/r/YUmReSXhMz" target="_blank" rel="noopener" aria-label="Study form, English (opens in a new tab)">English</a>
      <!-- TODO: Japanese Microsoft Form link. Replace this span with
           <a href="LINK" lang="ja" target="_blank" rel="noopener" aria-label="研究フォーム、日本語（新しいタブで開きます）">日本語</a> -->
      <span class="pick-off" lang="ja" aria-disabled="true">日本語<small>準備中</small></span>
    </div>
  </section>
  <div class="qr">
    <button type="button" id="qr-open" aria-haspopup="dialog">
      <img src="images/qr-home.svg" alt="QR code for this page">

</main>
<dialog id="qr-big" aria-label="QR code for this page">
  <img src="images/qr-home.svg" alt="QR code: https://cbct-2026.github.io/wisdom-tooth/">
  <p>https://cbct-2026.github.io/wisdom-tooth/</p>
  <button type="button" id="qr-close">Close / <span lang="ja">閉じる</span></button>
</dialog>
<script src="theme.js"></script>
<script>
const qrBig = document.getElementById('qr-big');
document.getElementById('qr-open').addEventListener('click', () => {
  qrBig.showModal();
  if (qrBig.requestFullscreen) qrBig.requestFullscreen().catch(() => {});
});
const closeQr = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); qrBig.close(); };
document.getElementById('qr-close').addEventListener('click', closeQr);
// Only the Close button or Esc closes it, so a stray tap while someone scans does not.
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && qrBig.open) qrBig.close(); });
</script>
</body>
</html>
